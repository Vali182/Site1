<!DOCTYPE html>
<html lang="ro"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>❤️ Pentru iubirea mea ❤️</title>
<style>
body{margin:0;overflow:hidden;background:linear-gradient(#ffb6d5,#ff7eb3);font-family:Georgia,serif;color:#fff;text-align:center}
#c{position:relative;z-index:2;padding:20px}
h1{font-size:3em;animation:type 4s steps(20),glow 2s infinite alternate;white-space:nowrap;overflow:hidden;width:20ch;margin:25px auto}
@keyframes type{from{width:0}to{width:20ch}}
@keyframes glow{from{text-shadow:0 0 10px #fff}to{text-shadow:0 0 30px #ff0066}}
img{width:min(320px,80vw);border-radius:20px;border:5px solid #fff;box-shadow:0 0 30px #fff;animation:pulse 1.5s infinite}
@keyframes pulse{50%{transform:scale(1.03)}}
.heart{display:inline-block;font-size:55px;animation:beat 1s infinite;margin:10px}
@keyframes beat{50%{transform:scale(1.3)}}
#counter{font-size:1.4em;background:rgba(255,255,255,.18);padding:12px;border-radius:15px;display:inline-block;margin-top:15px}
.petal,.spark,.float{position:fixed;pointer-events:none}
.spark{width:3px;height:3px;background:#fff;border-radius:50%;animation:twinkle 2s infinite}
@keyframes twinkle{50%{transform:scale(2);opacity:1}0%,100%{opacity:0}}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@keyframes rise{to{transform:translateY(-110vh)}}
</style></head><body>
<div id="c">
<h1>❤️ Te iubesc! ❤️</h1>
<img src="Iubi.jpeg" alt="">
<p style="font-size:1.5em">Îți mulțumesc, scumpa mea soție, pentru tot sprijinul și susținerea acordată.<br><b>TE IUBESC CEL MAI MULT! ❤️</b></p>
<div><span class="heart">❤️</span><span class="heart">❤️</span><span class="heart">❤️</span></div>
<div id="counter"></div>
</div>
<script>
for(let i=0;i<40;i++){let d=document.createElement('div');d.className='petal';d.textContent='🌹';d.style.left=Math.random()*100+'vw';d.style.top='-5vh';d.style.fontSize=(18+Math.random()*20)+'px';d.style.animation=`fall ${6+Math.random()*6}s linear ${Math.random()*6}s infinite`;document.body.appendChild(d);}
for(let i=0;i<120;i++){let s=document.createElement('div');s.className='spark';s.style.left=Math.random()*100+'vw';s.style.top=Math.random()*100+'vh';s.style.animationDelay=Math.random()*2+'s';document.body.appendChild(s);}
for(let i=0;i<25;i++){let h=document.createElement('div');h.className='float';h.textContent='💕';h.style.left=Math.random()*100+'vw';h.style.bottom='-30px';h.style.fontSize=(16+Math.random()*18)+'px';h.style.animation=`rise ${8+Math.random()*8}s linear ${Math.random()*8}s infinite`;document.body.appendChild(h);}
const start=new Date('2024-09-09T00:00:00');
function upd(){let now=new Date();let diff=now-start;let days=Math.floor(diff/86400000);
let years=Math.floor(days/365.2425);let d= new Date(start);
d.setFullYear(d.getFullYear()+years);
let months=0;while(true){let t=new Date(d);t.setMonth(t.getMonth()+1);if(t<=now){months++;d=t;}else break;}
let rem=now-d;let rd=Math.floor(rem/86400000);let hrs=Math.floor(rem%86400000/3600000);let mins=Math.floor(rem%3600000/60000);let secs=Math.floor(rem%60000/1000);
counter.textContent=`⏳ Împreună de ${years} ani, ${months} luni, ${rd} zile, ${hrs} ore, ${mins} minute și ${secs} secunde ❤️`;
}
setInterval(upd,1000);upd();
</script></body></html>
